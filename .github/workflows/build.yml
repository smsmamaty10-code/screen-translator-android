name: Build v4 Lens APK and AAB

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build v4.0 Lens-Style Screen Translator APK & AAB
        run: |
          gradle assembleRelease bundleRelease --stacktrace
          cp app/build/outputs/apk/release/*.apk ScreenTranslator-Lens-v4.apk
          cp app/build/outputs/bundle/release/*.aab ScreenTranslator-Lens-v4.aab

      - name: Publish Direct Download Release (v4.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0-lens
          name: "عدسة مترجم الشاشة الفوري v4.0 (ترجمة موضعية + زر صغير 36dp)"
          body: "الإصدار الرابع v4.0: زر دائري مصغر (36dp) وترجمة فورية في نفس مكان كل كلمة مثل عدسة جوجل."
          files: |
            ScreenTranslator-Lens-v4.apk
            ScreenTranslator-Lens-v4.aab

      - name: Upload v4 Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Lens-v4-APK
          path: ScreenTranslator-Lens-v4.apk

      - name: Upload v4 Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Lens-v4-AAB
          path: ScreenTranslator-Lens-v4.aab

