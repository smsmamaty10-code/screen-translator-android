name: Build Signed APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build v3.0 Google-Lens-Style In-Place Screen Translator APK & AAB
        run: |
          gradle assembleRelease bundleRelease --stacktrace
          cp app/build/outputs/apk/release/*.apk ScreenTranslator-v3.apk
          cp app/build/outputs/bundle/release/*.aab ScreenTranslator-v3.aab

      - name: Publish Direct Download Release (APK & AAB)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0-latest
          name: "مترجم الشاشة الفوري v3.0 (ترجمة موضعية مثل عدسة جوجل + زر عائم مصغر)"
          body: "الإصدار 3.0: زر عائم دائري صغير جداً + ترجمة النصوص مباشرة في نفس أماكنها فوق الشاشة مثل Google Lens تماماً."
          files: |
            ScreenTranslator-v3.apk
            ScreenTranslator-v3.aab

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-v3-Signed-APK
          path: ScreenTranslator-v3.apk

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-v3-Signed-AAB
          path: ScreenTranslator-v3.aab
