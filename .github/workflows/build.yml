name: Build Signed APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Signed Release APK & Signed AAB (with R8 mapping.txt)
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Signed-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Signed AAB (Includes R8 mapping)
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Signed-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload R8 ProGuard mapping.txt
        uses: actions/upload-artifact@v4
        with:
          name: R8-ProGuard-mapping-txt
          path: app/build/outputs/mapping/release/mapping.txt
