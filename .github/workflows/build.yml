name: Build Signed APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build v2.0 Signed APK & Signed AAB (With Custom Adaptive Icon)
        run: |
          gradle assembleRelease bundleRelease --stacktrace
          cp app/build/outputs/apk/release/*.apk ScreenTranslator-v2.apk
          cp app/build/outputs/bundle/release/*.aab ScreenTranslator-v2.aab

      - name: Publish Direct Download Release (APK & AAB)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-latest
          name: "مترجم الشاشة الفوري v2.0 (مع الأيقونة الجديدة والزر العائم)"
          body: "الإصدار 2.0 المزود بالأيقونة الزجاجية الجديدة والزر العائم لترجمة الشاشة."
          files: |
            ScreenTranslator-v2.apk
            ScreenTranslator-v2.aab

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-v2-Signed-APK
          path: ScreenTranslator-v2.apk

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-v2-Signed-AAB
          path: ScreenTranslator-v2.aab
