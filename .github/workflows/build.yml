name: Build Real Google-Lens v5.0 APK and AAB

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Bundle Arabic Fonts into Android Assets
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-dejavu-core || true
          mkdir -p app/src/main/assets/fonts
          for f in NotoKufiArabic-Bold.ttf NotoKufiArabic-Regular.ttf NotoNaskhArabic-Bold.ttf NotoNaskhArabic-Regular.ttf NotoSansArabic-Bold.ttf NotoSansArabic-Regular.ttf; do
            if [ -f "/usr/share/fonts/truetype/noto/$f" ]; then
              cp "/usr/share/fonts/truetype/noto/$f" "app/src/main/assets/fonts/$f"
            fi
          done
          for f in DejaVuSansMono-Bold.ttf DejaVuSansCondensed-Bold.ttf; do
            if [ -f "/usr/share/fonts/truetype/dejavu/$f" ]; then
              cp "/usr/share/fonts/truetype/dejavu/$f" "app/src/main/assets/fonts/$f"
            fi
          done
          ls -lh app/src/main/assets/fonts/ || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Signed v5.0 Lens Screen Translator APK & AAB
        run: |
          gradle assembleRelease bundleRelease --stacktrace
          cp app/build/outputs/apk/release/*.apk ScreenTranslator-Lens-v5.0.apk
          cp app/build/outputs/bundle/release/*.aab ScreenTranslator-Lens-v5.0.aab

      - name: Publish Direct Download Release (v5.0-lens)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0-lens
          name: "عدسة مترجم الشاشة الفوري v5.0 (الزر العائم الصغير + ترجمة عدسة جوجل + التخصيص والإيقاف)"
          body: "الإصدار الخامس الأصلي المبني بمكتبات Google ML Kit: زر عائم دائري صغير (36dp) + ترجمة موضعية مطابقة لعدسة جوجل + تخصيص الشكل واللون والخط والحجم + إيقاف كامل للتطبيق من الزر العائم."
          files: |
            ScreenTranslator-Lens-v5.0.apk
            ScreenTranslator-Lens-v5.0.aab

      - name: Upload v5.0 Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Lens-v5.0-APK
          path: ScreenTranslator-Lens-v5.0.apk

      - name: Upload v5.0 Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Lens-v5.0-AAB
          path: ScreenTranslator-Lens-v5.0.aab

