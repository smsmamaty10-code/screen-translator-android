plugins {
    id 'com.android.application'
}

android {
    namespace "com.screentranslator.capacitor"
    compileSdk 34

    defaultConfig {
        applicationId "com.screentranslator.capacitor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile rootProject.file("keystore/screen-translator-release.jks")
            storePassword "ScreenTrans2026!"
            keyAlias "screentranslator_key"
            keyPassword "ScreenTrans2026!"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
