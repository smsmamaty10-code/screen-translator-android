import java.util.Properties
import java.io.FileInputStream

plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.screentranslator.capacitor"
    compileSdk 34

    defaultConfig {
        applicationId "com.screentranslator.capacitor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // الخطوة 5: التوقيع بمفتاح الـ Keystore الثابت لتحديث التطبيق بدون مشاكل
    signingConfigs {
        release {
            storeFile file(keystoreProperties.getProperty('storeFile', '../keystore/screen-translator-release.jks'))
            storePassword keystoreProperties.getProperty('storePassword', 'ScreenTrans2026!')
            keyAlias keystoreProperties.getProperty('keyAlias', 'screentranslator_key')
            keyPassword keystoreProperties.getProperty('keyPassword', 'ScreenTrans2026!')
        }
    }

    // الخطوة 4: ضغط الكود عبر R8/ProGuard وتضمين ملف الـ mapping تلقائياً داخل الـ AAB
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            signingConfig signingConfigs.release
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
    // الخطوة 3: مكتبة إعلانات Google AdMob الرسمية
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
