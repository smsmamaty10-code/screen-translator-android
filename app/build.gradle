plugins {
    id 'com.android.application'
}

android {
    namespace "com.screentranslator.capacitor"
    compileSdk 34

    defaultConfig {
        applicationId "com.screentranslator.capacitor"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "5.0.0"
    }

    signingConfigs {
        release {
            storeFile rootProject.file("keystore/screen-translator-release.jks")
            storePassword "ScreenTrans2026!"
            keyAlias "screentranslator_key"
            keyPassword "ScreenTrans2026!"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.release
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.mlkit:text-recognition:16.0.0'
    implementation 'com.google.mlkit:language-id:17.0.5'
    implementation 'com.google.mlkit:translate:17.0.2'
}
